# Compila el APK de Rutia en GitHub, sin cuenta de Expo.
# - En un pull request que toca mobile/: compila y deja el APK como artefacto (para probar).
# - Al subir una etiqueta v* (por ejemplo v1.0.0): compila y crea el release con el APK adjunto.
# - A mano (Actions → APK Android → Run workflow, con «publicar» marcado): compila y crea el release
#   v<versión de app.json> sobre main, con su etiqueta.
name: APK Android

on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/apk-android.yml']
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Crear el release con el APK (etiqueta v + versión de app.json)'
        type: boolean
        default: false

permissions:
  contents: write # para crear el release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      # La app apunta al backend publicado en Render (Expo lo incrusta al compilar)
      EXPO_PUBLIC_API_URL: https://rutia-api.onrender.com/api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: npm install

      - name: Generar el proyecto Android
        run: npx expo prebuild --platform android --no-install

      - name: Compilar el APK
        working-directory: mobile/android
        # Solo procesadores ARM (los celulares reales): compila más rápido y pesa menos
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Nombrar el APK con la versión de app.json
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          cp android/app/build/outputs/apk/release/app-release.apk "rutia-v$VERSION.apk"
          echo "APK=rutia-v$VERSION.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: mobile/${{ env.APK }}

      - name: Crear el release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ETIQUETA="${APK#rutia-}"
          ETIQUETA="${ETIQUETA%.apk}"
          gh release create "$ETIQUETA" "$APK" --target "$GITHUB_SHA" \
            --title "Rutia $ETIQUETA" \
            --notes "App Android de Rutia. Descarga \`$APK\`, ábrelo en el celular y acepta instalar desde el navegador.

          Usuario de prueba (ficticio): \`demo@rutia.test\` / \`rutia-demo-2026\`.
          Manual: https://github.com/Sxnr/Rutia/blob/main/docs/hito-3/manual.md"
