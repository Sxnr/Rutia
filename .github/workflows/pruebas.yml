# Integración continua: corre las pruebas del backend y de la app en cada carga a main y en cada pull request.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # PostgreSQL desechable, solo para las pruebas (nunca la base de Supabase)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rutia_pruebas
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rutia_pruebas
      # Solo para que la configuración cargue; conftest.py la reemplaza por TEST_DATABASE_URL
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar el backend
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Pruebas del backend (pytest)
        working-directory: backend
        run: pytest -v

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Levantar el backend sobre la base de pruebas
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rutia_pruebas
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/v1/health && exit 0
            sleep 1
          done
          echo "El backend no levantó" && exit 1

      - name: Pruebas de la app (node:test contra el backend)
        working-directory: mobile
        env:
          RUTIA_API_URL: http://localhost:8000/api/v1
        run: npm test
